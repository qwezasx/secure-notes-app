name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==================== CI: ПРОВЕРКИ ====================
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Bandit
      run: pip install bandit
    
    - name: Run Bandit and Show Results
      id: bandit
      run: |
        echo "================================================"
        echo "🔍 STARTING SECURITY SCAN WITH BANDIT"
        echo "================================================"
        echo ""
        
        # Шаг 1: Запускаем Bandit и показываем результаты сразу
        echo "📋 RUNNING BANDIT SCAN..."
        echo "--------------------------------"
        bandit -r . -f txt -c .bandit.yml || echo "Scan completed"
        echo ""
        
        # Шаг 2: Сохраняем в JSON для проверки
        echo "💾 SAVING DETAILED REPORT..."
        bandit -r . -f json -o bandit_report.json -c .bandit.yml 2>/dev/null || true
        echo ""
        
        # Шаг 3: Проверяем результаты (без Python import)
        echo "📊 ANALYZING RESULTS..."
        echo "--------------------------------"
        
        if [ ! -f "bandit_report.json" ]; then
          echo "⚠️  No report generated"
          exit 0
        fi
        
        # Используем grep и awk для анализа (без Python)
        HIGH_COUNT=$(grep -c '"issue_severity": "HIGH"' bandit_report.json)
        MEDIUM_COUNT=$(grep -c '"issue_severity": "MEDIUM"' bandit_report.json)
        LOW_COUNT=$(grep -c '"issue_severity": "LOW"' bandit_report.json)
        
        echo "📈 SECURITY SCAN SUMMARY:"
        echo "  🔴 HIGH severity: $HIGH_COUNT"
        echo "  🟡 MEDIUM severity: $MEDIUM_COUNT"
        echo "  🟢 LOW severity: $LOW_COUNT"
        echo ""
        
        if [ "$HIGH_COUNT" -gt 0 ]; then
          echo "❌❌❌ CRITICAL ISSUES FOUND! ❌❌❌"
          echo ""
          echo "🔴 HIGH SEVERITY VULNERABILITIES:"
          echo "--------------------------------"
          
          # Извлекаем информацию о HIGH уязвимостях с помощью sed/awk
          # Берем блоки с HIGH severity
          grep -A 10 -B 2 '"issue_severity": "HIGH"' bandit_report.json | \
          while IFS= read -r line; do
            # Ищем название теста
            if echo "$line" | grep -q '"test_name"'; then
              TEST_NAME=$(echo "$line" | sed 's/.*"test_name": "\([^"]*\)".*/\1/')
              echo "  🚨 $TEST_NAME"
            fi
            
            # Ищем файл и строку
            if echo "$line" | grep -q '"filename"'; then
              FILENAME=$(echo "$line" | sed 's/.*"filename": "\([^"]*\)".*/\1/')
            fi
            
            if echo "$line" | grep -q '"line_number"'; then
              LINE=$(echo "$line" | sed 's/.*"line_number": \([0-9]*\).*/\1/')
              if [ -n "$FILENAME" ] && [ -n "$LINE" ]; then
                echo "     📄 File: $FILENAME:$LINE"
                FILENAME=""
                LINE=""
              fi
            fi
            
            # Ищем описание
            if echo "$line" | grep -q '"issue_text"'; then
              ISSUE_TEXT=$(echo "$line" | sed 's/.*"issue_text": "\([^"]*\)".*/\1/')
              echo "     📝 $ISSUE_TEXT"
              echo ""
            fi
          done
          
          echo ""
          echo "================================================"
          echo "🚫 MERGE BLOCKED: Found $HIGH_COUNT critical vulnerabilities!"
          echo "================================================"
          exit 1
        else
          echo "✅✅✅ ALL CHECKS PASSED ✅✅✅"
          echo "No critical vulnerabilities found."
          echo ""
          echo "================================================"
          echo "✅ MERGE APPROVED: Security check passed"
          echo "================================================"
        fi
    
    - name: Final Status
      if: always()
      run: |
        echo "=== PIPELINE STATUS ==="
        echo "Security scan completed."
        echo "Check the 'Run Bandit and Show Results' step for details."

# ==================== CD: РАЗВЕРТЫВАНИЕ ====================
  deploy:
    runs-on: ubuntu-latest
    needs: security-scan  # Запускаем только sc если прошел
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Только при пуше в main
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install gunicorn
    
    - name: Create Procfile for Heroku
      run: |
        echo "web: gunicorn app:app" > Procfile
        echo "Python runtime" > runtime.txt
    
    - name: Create requirements.txt for production
      run: |
        echo "Flask==2.3.3" > requirements_prod.txt
        echo "Flask-WTF==1.0.1" >> requirements_prod.txt
        echo "Werkzeug==2.2.3" >> requirements_prod.txt
        echo "SQLAlchemy==2.0.23" >> requirements_prod.txt
        echo "Jinja2==3.1.2" >> requirements_prod.txt
        echo "WTForms==3.0.1" >> requirements_prod.txt
        echo "bleach==6.0.0" >> requirements_prod.txt
        echo "python-dotenv==1.0.0" >> requirements_prod.txt
        echo "gunicorn==21.2.0" >> requirements_prod.txt
    
    - name: Create deployment package
      run: |
        echo "📦 Creating deployment package..."
        mkdir -p deploy_package
        cp -r app.py models.py forms.py requirements_prod.txt Procfile runtime.txt deploy_package/
        cp -r static templates deploy_package/ 2>/dev/null || true
        
        echo "✅ Package created"
        ls -la deploy_package/
    
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: deploy_package/
    
    - name: Deployment Notification
      run: |
        echo "🚀 DEPLOYMENT READY!"
        echo ""
        echo "Application can be deployed to:"
        echo "1. Heroku: heroku create && git push heroku main"
        echo "2. PythonAnywhere: Upload files via dashboard"
        echo "3. AWS/Google Cloud: Use deployment package"
        echo ""
        echo "✅ CI/CD pipeline completed successfully!"
