name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    - run: pip install bandit
    - name: Security Check
      run: |
        bandit -r . -c .bandit.yml
        bandit -r . -f json -o report.json -c .bandit.yml 2>/dev/null || true
        if [ -f "report.json" ] && grep -q "HIGH" report.json; then
          echo "❌ Security issues found"
          exit 1
        else
          echo "✅ Security passed"
        fi
  
  deploy:
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    - name: Prepare Deployment
      run: |
        echo "🚀 Deployment ready!"
        echo "Security checks: ✅ PASSED"
        mkdir -p deployment
        cp app.py models.py forms.py requirements.txt deployment/
        echo "Deployment package created"
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: app-deployment
        path: deployment/
