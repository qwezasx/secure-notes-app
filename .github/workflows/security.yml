name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Bandit
      run: pip install bandit
    
    - name: Run Security Scan
      run: |
        echo "Running security scan..."
        bandit -r . -c .bandit.yml
        echo "Security scan completed"
    
    - name: Check Results
      run: |
        echo "Checking for issues..."
        bandit -r . -f json -o report.json -c .bandit.yml 2>/dev/null || true
        
        if [ -f report.json ]; then
          echo "Checking report..."
          # Простая проверка без сложного grep
          if grep -q '"issue_severity": "HIGH"' report.json; then
            echo "Found HIGH severity issues"
            exit 1
          else
            echo "No HIGH severity issues found"
          fi
        else
          echo "No report file"
        fi
  
  deploy:
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy Preparation
      run: |
        echo "Deployment started"
        echo "Security checks passed"
        echo "Creating deployment package..."
        
        mkdir -p deploy
        echo "app.py" > deploy/files.txt
        echo "models.py" >> deploy/files.txt
        echo "forms.py" >> deploy/files.txt
        echo "requirements.txt" >> deploy/files.txt
        
        echo "Package created"
    
    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: deployment
        path: deploy/
