name: Security Check

on: [push, pull_request]

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Bandit
      run: pip install bandit
    
    - name: Run Bandit
      run: |
        bandit -r . -f json -o report.json || true
        
    - name: Check Results
      run: |
        if [ -f report.json ]; then
          echo "Checking for high severity issues..."
          # Простая проверка на наличие слова HIGH в отчете
          if grep -q '"issue_severity": "HIGH"' report.json; then
            echo "❌ HIGH severity issues found! Blocking merge."
            exit 1
          else
            echo "✅ No HIGH severity issues found."
          fi
        else
          echo "No report generated"
        fi
