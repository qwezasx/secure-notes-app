# Конфигурация Bandit для проекта "Безопасные заметки"
# targets: список файлов/папок для сканирования
targets:
  - app.py
  - models.py
  - forms.py
  - tests/

# exclude_dirs: папки для исключения
exclude_dirs:
  - .git
  - .github
  - __pycache__
  - venv
  - env
  - .venv
  - node_modules
  - static
  - templates

# skips: тесты Bandit для пропуска
skips:
  - B101  # assert used (разрешаем в тестах)
  - B105  # hardcoded_password_string (SECRET_KEY использует .env)
  - B106  # hardcoded_password_funcarg
  - B107  # hardcoded_password_default
  - B108  # hardcoded_tmp_directory
  - B110  # try_except_pass (нужно для обработки ошибок)
  - B112  # try_except_continue (нужно для обработки ошибок)
  - B201  # flask_debug_true (игнорируем в app.py, т.к. это dev настройка)
  - B104  # hardcoded_bind_all_interfaces
# tests: включаемые тесты (по умолчанию все, но можно ограничить)
tests:
  - B301  # pickle
  - B302  # marshal
  - B303  # md5
  - B304  # ciphers
  - B307  # eval
  - B308  # mark_safe
  - B310  # urllib_urlopen
  - B311  # random
  - B401  # import_telnetlib
  - B403  # import_pickle
  - B404  # import_subprocess
  - B502  # ssl_with_no_version
  - B506  # yaml_load
  - B602  # subprocess_popen_with_shell_equals_true
  - B603  # subprocess_without_shell_equals_true
  - B608  # hardcoded_sql_expressions
  - B609  # linux_commands_wildcard_injection
  - B701  # jinja2_autoescape_false

# Исключения для конкретных файлов
ignore:
  - "app.py:app.config['SECRET_KEY'] = os.environ.get('SECRET_KEY') or"
  - "app.py:debug_mode = os.environ.get('FLASK_DEBUG', '').lower() == 'true'"
